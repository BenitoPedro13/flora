[tool.poetry]
name = "flora-backend"
version = "0.1.0"
description = "Satellite Data API"
authors = ["Flora Team <team@example.com>"]
package-mode = false
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.10"
fastapi = "^0.109.0"
uvicorn = "^0.27.0"
google-api-python-client = "^2.100.0"
earthengine-api = "^0.1.300"
python-dotenv = "^1.2.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
ruff = "^0.2.0"
pytest-asyncio = "0.21.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
python_files = ["test_*.py"]
testpaths = ["tests"]

